[project]
name = "rewind"
version = "0.1.0"
description = "Rewind for AI agents on Temporal: undo real-world effects from a step and re-run it with a correction"
readme = "README.md"
license = "MIT"
authors = [{ name = "Zach Fong" }]
requires-python = ">=3.10"
dependencies = ["temporalio==1.34.0"]

[project.optional-dependencies]
dev = ["ruff==0.12.7"]

[project.urls]
Repository = "https://github.com/Zach-Fong/rewind"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rewind*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM105",  # try/except/pass reads more plainly than contextlib.suppress
    "SIM117",  # check_rewind's nested `async with` reads better than one long line
]

[tool.ruff.lint.per-file-ignores]
"tests/check_*.py" = ["E402"]  # these scripts set env vars before importing, on purpose

[tool.ruff.lint.isort]
known-first-party = ["rewind", "example", "testbed"]
